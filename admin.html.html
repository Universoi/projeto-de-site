<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMDROP | TERMINAL CRIPTOGRAFADO</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --hacker-green: #00ff41;
            --hacker-cyan: #00f2ff;
            --hacker-red: #ff003c;
            --bg-black: #050505;
            --card-glass: rgba(0, 242, 255, 0.05);
            --border: rgba(0, 242, 255, 0.2);
        }

        body {
            background-color: var(--bg-black);
            /* Efeito de linhas de monitor antigo */
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            color: var(--hacker-cyan);
            font-family: 'Fira Code', monospace;
            margin: 0;
            overflow-x: hidden;
        }

        /* Camada de interferência visual */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            pointer-events: none;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%; border-bottom: 2px solid var(--hacker-cyan);
            background: rgba(0, 0, 0, 0.9);
            text-shadow: 0 0 10px var(--hacker-cyan);
        }

        .logo { 
            cursor: pointer; font-size: 1.8rem; font-weight: 800; 
            letter-spacing: 4px; color: var(--hacker-cyan);
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        /* Card Estilo Hacker */
        .card {
            background: var(--card-glass);
            border: 1px solid var(--border);
            padding: 25px;
            position: relative;
            transition: 0.3s;
            /* Canto cortado para estilo futurista */
            clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        .card:hover {
            border-color: var(--hacker-green);
            background: rgba(0, 255, 65, 0.05);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .status-tag {
            font-size: 0.7rem; color: var(--hacker-green);
            text-transform: uppercase; margin-bottom: 10px; display: block;
            font-weight: bold;
        }

        h3 { margin: 10px 0; font-size: 1.3rem; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 5px; }

        .desc { font-size: 0.85rem; color: rgba(0, 242, 255, 0.6); margin-bottom: 20px; }

        .data-box {
            background: rgba(0, 0, 0, 0.9);
            border: 1px dashed var(--hacker-green);
            padding: 15px; margin-top: 15px; display: none;
            font-size: 0.8rem;
            animation: glitch 0.2s ease;
        }

        @keyframes glitch {
            0% { transform: translate(2px, 0); }
            50% { transform: translate(-2px, 0); }
            100% { transform: translate(0); }
        }

        .btn-main {
            width: 100%;
            background: transparent;
            border: 1px solid var(--hacker-cyan);
            color: var(--hacker-cyan);
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-main:hover {
            background: var(--hacker-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--hacker-cyan);
        }

        /* Painel Admin Terminal */
        #adminModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 2000; align-items: center; justify-content: center;
        }

        .admin-content {
            background: #000; border: 2px solid var(--hacker-green);
            padding: 30px; width: 90%; max-width: 500px;
            box-shadow: 0 0 30px var(--hacker-green);
        }

        input, select {
            width: 100%; background: #000; border: 1px solid var(--hacker-green);
            padding: 12px; color: var(--hacker-green); margin-bottom: 15px;
            font-family: 'Fira Code', monospace; outline: none;
        }

        .btn-add {
            background: var(--hacker-green); color: #000; border: none;
            padding: 15px; width: 100%; font-weight: bold; cursor: pointer;
            text-transform: uppercase;
        }

        .del-btn {
            position: absolute; top: 10px; right: 10px; color: var(--hacker-red);
            background: none; border: none; cursor: pointer; font-weight: bold;
        }

        #toast {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--hacker-green); color: #000;
            padding: 10px 20px; font-weight: bold; display: none;
            z-index: 3000; border-radius: 4px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="openAdmin()">> STREAMDROP_</div>
        <div id="count-badge">SISTEMA_ATIVO: 00</div>
    </nav>

    <div class="container">
        <div class="grid" id="mainGrid">
            <p>CONECTANDO AO SERVIDOR SECUNDÁRIO...</p>
        </div>
    </div>

    <div id="adminModal">
        <div class="admin-content">
            <h2 style="color: var(--hacker-green); margin-top: 0;">[ ACESSO_ROOT ]</h2>
            <input type="password" id="adminPass" placeholder="SENHA_MESTRA">
            <hr style="border: 1px solid var(--hacker-green); margin: 20px 0; opacity: 0.3;">
            <input type="text" id="f-servico" placeholder="NOME_DA_PLATAFORMA">
            <input type="text" id="f-desc" placeholder="NÍVEL_DE_CRIPTOGRAFIA (EX: Ultra HD)">
            <select id="f-icon">
                <option value="terminal">ÍCONE: TERMINAL</option>
                <option value="shield">ÍCONE: ESCUDO</option>
                <option value="activity">ÍCONE: PULSO</option>
                <option value="cpu">ÍCONE: PROCESSADOR</option>
            </select>
            <input type="text" id="f-user" placeholder="USUARIO_ID">
            <input type="text" id="f-pass" placeholder="CHAVE_DE_ACESSO">
            <button class="btn-add" onclick="saveToSupabase()">INJETAR_DADOS</button>
            <button onclick="closeAdmin()" style="background:none; border:none; color:grey; width:100%; margin-top:15px; cursor:pointer; font-family: 'Fira Code';">ABORTAR_MISSAO</button>
        </div>
    </div>

    <div id="toast">DADOS_EXTRAIDOS_COM_SUCESSO</div>

    <script>
        // Configurações do seu Supabase
        const SUPABASE_URL = 'https://zkhradhpwakvtgsilsyj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UrUxPsPD3XBTANwwp3tZOA_-REppnf3';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const ADMIN_PASSWORD = "123"; 

        async function init() {
            loadContas();
            // Escuta mudanças em tempo real
            _supabase.channel('mudancas-db')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'contas' }, () => {
                    loadContas();
                }).subscribe();
        }

        async function loadContas() {
            const { data, error } = await _supabase.from('contas').select('*').order('created_at', { ascending: false });
            if (!error) renderCards(data);
            document.getElementById('count-badge').innerText = `SISTEMA_ATIVO: ${data?.length || 0}`;
        }

        function renderCards(contas) {
            const grid = document.getElementById('mainGrid');
            if(contas.length === 0) {
                grid.innerHTML = "<p>AGUARDANDO INJEÇÃO DE DADOS...</p>";
                return;
            }

            grid.innerHTML = contas.map(c => `
                <div class="card">
                    <button class="del-btn" onclick="deleteConta(${c.id})">[X]</button>
                    <span class="status-tag">>> CONEXÃO_ESTABELECIDA</span>
                    <div style="color: var(--hacker-cyan); margin-bottom: 15px"><i data-lucide="${c.icon || 'terminal'}"></i></div>
                    <h3>${c.servico}</h3>
                    <p class="desc">${c.desc_servico}</p>
                    <div class="data-box" id="box-${c.id}">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom: 1px solid rgba(0,255,65,0.2); padding-bottom: 5px;">
                            <span>USUÁRIO: ${c.usuario}</span>
                            <button onclick="copy('${c.usuario}')" style="background:none; border:none; color:var(--hacker-green); cursor:pointer; font-family: 'Fira Code';">[COPIAR]</button>
                        </div>
                        <div style="display:flex; justify-content:space-between">
                            <span>SENHA: ••••••••</span>
                            <button onclick="copy('${c.senha}')" style="background:none; border:none; color:var(--hacker-green); cursor:pointer; font-family: 'Fira Code';">[DECRIPTAR]</button>
                        </div>
                    </div>
                    <button class="btn-main" onclick="document.getElementById('box-${c.id}').style.display='block'">OBTER_CREDENCIAIS</button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function saveToSupabase() {
            if(document.getElementById('adminPass').value !== ADMIN_PASSWORD) return alert("ACESSO NEGADO: CREDENCIAIS INCORRETAS");
            
            const payload = {
                servico: document.getElementById('f-servico').value,
                desc_servico: document.getElementById('f-desc').value,
                icon: document.getElementById('f-icon').value,
                usuario: document.getElementById('f-user').value,
                senha: document.getElementById('f-pass').value,
                status: 'Ativo'
            };

            const { error } = await _supabase.from('contas').insert([payload]);
            if (!error) { 
                showToast("DADOS_INJETADOS"); 
                closeAdmin(); 
                // Limpa campos
                document.querySelectorAll('input').forEach(i => i.value = "");
            } else {
                alert("FALHA NA INJEÇÃO: " + error.message);
            }
        }

        async function deleteConta(id) {
            const rootPass = prompt("CONFIRME SENHA_ROOT PARA DELETAR:");
            if(rootPass === ADMIN_PASSWORD) {
                await _supabase.from('contas').delete().eq('id', id);
                showToast("DADOS_ELIMINADOS");
            }
        }

        function openAdmin() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
        
        function copy(text) {
            navigator.clipboard.writeText(text);
            showToast("DADOS_COPIADOS");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        init();
    </script>
</body>
</html>
