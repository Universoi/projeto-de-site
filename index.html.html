<html lang="pt-br">
<head>
<meta charset="UTF-8">

<title>Jardson Imports | Catálogo Completo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #f8f9fa;
    color: #1a1a1a;
    padding-bottom: 100px;
}

.glass-header {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
}
.product-card {
    background: white;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.05);
    transition: 0.3s;
    cursor: pointer;
    position: relative;
}
.product-card:active { transform: scale(0.96); }
.category-pill {
    white-space: nowrap;
    padding: 8px 16px;
    border-radius: 20px;
    background: white;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid #eee;
    transition: 0.3s;
    flex-shrink: 0;
    cursor: pointer;
}
.category-pill.active { background: #ee4d2d; color: white; border-color: #ee4d2d; }

.side-modal {
    position: fixed;
    top: 0;
    right: -100%;
    width: 100%;
    height: 100%;
    background: white;
    z-index: 200;
    transition: 0.4s;
    overflow-y: auto;
}
.side-modal.active { right: 0; }
@media (min-width: 768px) { .side-modal { width: 420px; box-shadow: -10px 0 30px rgba(0,0,0,0.1); } }

.nav-bottom {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    max-width: 450px;
    background: #1a1a1a;
    border-radius: 25px;
    display: flex;
    padding: 12px;
    z-index: 100;
}
.nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #777;
    font-size: 10px;
    cursor: pointer;
}
.nav-item.active { color: white; }
.discount-tag {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #ff4d4d;
    color: white;
    padding: 3px 7px;
    border-radius: 6px;
    font-size: 9px;
    font-weight: 800;
    z-index: 10;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>

<body>

<!-- HEADER -->
<header class="glass-header sticky top-0 z-50 border-b border-gray-100 px-5 py-4 flex justify-between items-center">
    <div>
        <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Laranjal do Jari</p>
        <h1 class="text-xl font-extrabold tracking-tighter">JARDSON<span class="text-[#ee4d2d]">IMPORTS</span></h1>
    </div>
    <button onclick="openModal('cart-modal')" class="relative p-2 bg-gray-100 rounded-full">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-[#ee4d2d] text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
    </button>
</header>

<!-- CATEGORIAS -->
<div class="flex overflow-x-auto gap-2 max-w-5xl mx-auto pb-4 category-scroll justify-start md:justify-center px-4" data-aos="fade-up">
    <span onclick="filterCategory('all', this)" class="category-pill active">Todos</span>
    <span onclick="filterCategory('iphone', this)" class="category-pill">iPhone</span>
    <span onclick="filterCategory('samsung', this)" class="category-pill">Samsung</span>
    <span onclick="filterCategory('xiaomi', this)" class="category-pill">Xiaomi</span>
    <span onclick="filterCategory('tablet', this)" class="category-pill">Tablet</span>
    <span onclick="filterCategory('realme', this)" class="category-pill">Realme</span>
    <span onclick="filterCategory('som', this)" class="category-pill">Som</span>
    <span onclick="filterCategory('motorola', this)" class="category-pill">Motorola</span>
    <span onclick="filterCategory('tv', this)" class="category-pill">TV & Box</span>
    <span onclick="filterCategory('games', this)" class="category-pill">Games</span>
    <span onclick="filterCategory('acessorios', this)" class="category-pill">Acessorios</span>
    <span onclick="filterCategory('outros', this)" class="category-pill">Outros</span>
</div>

<!-- VITRINE -->
<main class="p-4 grid grid-cols-2 md:grid-cols-4 gap-3" id="vitrine"></main>

<!-- MODAL PERFIL -->
<div id="profile-modal" class="side-modal">
    <div class="p-6">
        <button onclick="closeAllModals()" class="mb-6"><i class="fa-solid fa-xmark text-xl"></i></button>

        <!-- PERFIL LOGADO -->
        <div id="user-logged" class="hidden text-center">
            <div class="relative w-24 h-24 mx-auto mb-4">
                <img id="profile-pic" src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full object-cover border-2 border-[#ee4d2d]">
                <label for="photo-input" class="absolute bottom-0 right-0 bg-[#ee4d2d] text-white w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-camera text-xs"></i>
                </label>
                <input type="file" id="photo-input" accept="image/*" class="hidden">
            </div>
            <h3 id="user-name-display" class="font-bold text-lg"></h3>
            <p id="user-addr-display" class="text-xs text-gray-500"></p>
            <p id="user-ref-display" class="text-[10px] text-orange-500 italic mb-6"></p>
            <button onclick="logout()" class="w-full py-3 bg-red-50 text-red-500 rounded-xl font-bold text-sm uppercase">Sair / Editar</button>
        </div>

        <!-- FORM CADASTRO -->
        <form id="user-form" class="space-y-4">
            <h2 class="font-black text-xl">Seu Cadastro</h2>
            <input type="text" id="reg-nome" placeholder="Nome Completo" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-rua" placeholder="Rua / Avenida" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-num" placeholder="Número da Casa" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-bairro" placeholder="Bairro" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-ref" placeholder="Ponto de Referência" class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <button type="submit" class="w-full py-4 bg-[#ee4d2d] text-white rounded-xl font-bold shadow-lg">SALVAR DADOS</button>
        </form>
    </div>
</div>

<!-- MODAL CARRINHO -->
<div id="cart-modal" class="side-modal flex flex-col">
    <div class="p-6 border-b flex justify-between items-center bg-white">
        <button onclick="closeAllModals()"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="font-bold uppercase tracking-tighter">SUA SACOLA</span>
        <button onclick="clearCart()" class="text-[10px] font-bold text-red-500 underline uppercase">Limpar</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4" id="cart-items"></div>
    <div class="p-4 bg-white border-t">
        <div class="flex gap-2 mb-4">
            <input type="text" id="coupon-input" placeholder="CUPOM: JARDSON25" class="flex-1 p-3 bg-gray-50 rounded-xl text-sm outline-none border border-gray-100 uppercase">
            <button onclick="applyCoupon()" class="px-4 bg-black text-white rounded-xl text-xs font-bold">APLICAR</button>
        </div>
        <div class="flex justify-between text-sm text-gray-500 mb-1"><span>Subtotal:</span><span id="sub-val">R$ 0,00</span></div>
        <div class="flex justify-between text-sm text-gray-500 mb-3"><span>Desconto:</span><span id="desc-val" class="text-green-600">- R$ 0,00</span></div>
        <div class="flex justify-between mb-4 font-black text-xl text-[#ee4d2d]"><span>Total:</span><span id="total-val">R$ 0,00</span></div>
        <button onclick="finishOrder()" class="w-full py-4 bg-green-500 text-white rounded-2xl font-bold flex items-center justify-center gap-2">
            <i class="fa-brands fa-whatsapp text-xl"></i> FINALIZAR NO WHATSAPP
        </button>
    </div>
</div>

<!-- NAV BOTTOM -->
<nav class="nav-bottom">

// ---------- CARRINHO ----------
let cart = [];
let user = JSON.parse(localStorage.getItem('jardson_db')) || null;
let discount = 0;
let activeCoupon = "Nenhum";

// ---------- RENDER PRODUTOS ----------
function renderProducts(cat='all'){
    const vitrine = document.getElementById('vitrine');
    const filtered = cat==='all'? products : products.filter(p=>p.category===cat);
    vitrine.innerHTML = filtered.map(p => `
    <div class="product-card p-3" onclick="addToCart(${p.id})">
        ${p.promo?'<span class="discount-tag">PROMOÇÃO</span>':''}
        <img src="${p.image}" class="w-full aspect-square object-contain mb-3 rounded-lg">
        <h3 class="text-[10px] font-bold text-gray-700 h-8 line-clamp-2 leading-tight">${p.name}</h3>
        <p class="text-sm font-black text-[#ee4d2d] mt-2">R$ ${p.price.toLocaleString('pt-BR')}</p>
        <button class="w-full mt-2 py-2 bg-black text-white text-[9px] font-bold rounded-lg uppercase">Adicionar</button>
    </div>`).join('');
}

// ---------- FILTRO ----------
function filterCategory(cat, el){
    document.querySelectorAll('.category-pill').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
    renderProducts(cat);
}

// ---------- CARRINHO ----------
function addToCart(id){ cart.push(products.find(p=>p.id===id)); updateCart(); openModal('cart-modal'); }
function clearCart(){ if(confirm("Deseja limpar sua sacola?")){ cart=[]; updateCart(); } }
function removeFromCart(i){ cart.splice(i,1); updateCart(); }
function updateCart(){
    document.getElementById('cart-count').innerText = cart.length;
    const itemsDiv = document.getElementById('cart-items');
    itemsDiv.innerHTML = cart.length===0?'<div class="text-center py-10 text-gray-400">Sacola vazia</div>':
    cart.map((p,i)=>`<div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl mb-2">
    <img src="${p.image}" class="w-10 h-10 object-contain rounded bg-white">
    <div class="flex-1"><h4 class="text-[10px] font-bold">${p.name}</h4><p class="text-[#ee4d2d] font-bold text-xs">R$ ${p.price.toLocaleString('pt-BR')}</p></div>
    <button onclick="removeFromCart(${i})" class="text-gray-300 px-2"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');

    const sub = cart.reduce((s,p)=>s+p.price,0);
    document.getElementById('sub-val').innerText=`R$ ${sub.toLocaleString('pt-BR')}`;
    document.getElementById('desc-val').innerText=`- R$ ${discount.toLocaleString('pt-BR')}`;
    document.getElementById('total-val').innerText=`R$ ${(sub-discount).toLocaleString('pt-BR')}`;
}

// ---------- CUPOM ----------
function applyCoupon(){
    const input = document.getElementById('coupon-input').value.trim().toUpperCase();
    if(input==="JARDSON25"){ discount=25; activeCoupon="JARDSON25"; alert("Cupom Aplicado!"); }
    else{ discount=0; activeCoupon="Nenhum"; alert("Cupom Inválido."); }
    updateCart();
}

// ---------- FINALIZAR PEDIDO ----------
function finishOrder(){
    if(!user) return openModal('profile-modal');
    if(cart.length===0) return alert("Sacola vazia!");
    
    const agora = new Date();
    const subtotal = cart.reduce((s,p)=>s+p.price,0);
    const total = subtotal-discount;
    const itens = cart.map(p=>`• ${p.name}`).join('\n');
    const foto = user.photo ? `\n📸 Foto do Cliente: ${user.photo}` : '';

    const mensagem = `🚀 *NOVO PEDIDO - JARDSON IMPORTS*${foto}

📅 *DATA:* ${agora.toLocaleDateString('pt-BR')} | ${agora.toLocaleTimeString('pt-BR',{hour:'2-digit', minute:'2-digit'})}
🆔 *Nº:* #${Math.floor(1000+Math.random()*9000)}

📦 *ITENS:*
${itens}

💳 *PAGAMENTO:* PIX
🎟️ *CUPOM:* ${activeCoupon}
💸 *DESCONTO:* R$ ${discount.toLocaleString('pt-BR')}

🚚 *ENTREGA*
📍 Endereço: ${user.rua}, Nº ${user.num}
🏘️ Bairro: ${user.bairro}
🏙️ Cidade: Laranjal do Jari / AP
🔍 Ref: ${user.ref}

💰 *TOTAL:* R$ ${total.toLocaleString('pt-BR')}

👤 *CLIENTE:* ${user.nome}
*ENVIE O COMPROVANTE!*`;

    window.open(`https://api.whatsapp.com/send?phone=5596991189596&text=${encodeURIComponent(mensagem)}`);
}

// ---------- CADASTRO ----------
document.getElementById('user-form').addEventListener('submit',function(e){
    e.preventDefault();
    user={
        nome: document.getElementById('reg-nome').value,
        rua: document.getElementById('reg-rua').value,
        num: document.getElementById('reg-num').value,
        bairro: document.getElementById('reg-bairro').value,
        ref: document.getElementById('reg-ref').value || "Não informado",
        photo: user?.photo || ""
    };
    localStorage.setItem('jardson_db',JSON.stringify(user));
    updateUI();
});

// ---------- ATUALIZA UI ----------
function updateUI(){
    if(user){
        document.getElementById('user-form').classList.add('hidden');
        document.getElementById('user-logged').classList.remove('hidden');

        document.getElementById('user-name-display').innerText = user.nome;
        document.getElementById('user-addr-display').innerText = `${user.rua}, Nº ${user.num} - ${user.bairro}`;
        document.getElementById('user-ref-display').innerText = `Referência: ${user.ref}`;
        if(user.photo) document.getElementById('profile-pic').src = user.photo;
    }
}
function logout(){ if(confirm("Deseja editar seus dados?")){ localStorage.removeItem('jardson_db'); user=null; updateUI(); document.getElementById('user-form').classList.remove('hidden'); document.getElementById('user-logged').classList.add('hidden'); } }

// ---------- MODAIS ----------
function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeAllModals(){ document.querySelectorAll('.side-modal').forEach(m=>m.classList.remove('active')); }

updateCart();
updateUI();
renderProducts();
</script>
