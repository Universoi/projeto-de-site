<div id="profile-modal" class="side-modal">

            </div>

            <p id="user-addr-display" class="text-xs text-gray-500"></p>
            <button onclick="logout()" class="w-full mt-6 py-3 bg-red-50 text-red-500 rounded-xl font-bold text-sm uppercase">Sair / Editar</button>
        </div>

            <h2 class="font-black text-xl">Seu Cadastro</h2>
            <input type="text" id="reg-nome" placeholder="Nome Completo" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-rua" placeholder="Rua / Avenida" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-num" placeholder="Número" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <input type="text" id="reg-bairro" placeholder="Bairro" required class="w-full p-4 bg-gray-50 rounded-xl text-sm outline-none">
            <button type="submit" class="w-full py-4 bg-[#ee4d2d] text-white rounded-xl font-bold">SALVAR DADOS</button>
        </form>
    </div>
</div>

<!-- MODAL CARRINHO -->
<div id="cart-modal" class="side-modal flex flex-col">

    <div class="p-4 bg-white border-t">
        <div class="flex justify-between mb-4 font-black text-xl text-[#ee4d2d]"><span>Total:</span><span id="total-val">R$ 0,00</span></div>

</div>

// FILTRO
function filterCategory(cat, el){
    document.querySelectorAll('.category-pill').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
    renderProducts(cat);
}

// CARRINHO
function addToCart(id){ cart.push(products.find(p=>p.id===id)); updateCart(); }
function removeFromCart(i){ cart.splice(i,1); updateCart(); }
function updateCart(){
    document.getElementById('cart-count').innerText = cart.length;
    const itemsDiv = document.getElementById('cart-items');
    itemsDiv.innerHTML = cart.length===0?'<div class="text-center py-10 text-gray-400 font-bold">Sua sacola está vazia</div>':
    cart.map((p,i)=>`<div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl mb-2">
        <img src="${p.image}" class="w-10 h-10 object-contain">
        <div class="flex-1 text-[10px] font-bold">${p.name}</div>
        <button onclick="removeFromCart(${i})" class="text-red-500 p-2"><i class="fa-solid fa-xmark"></i></button>
    </div>`).join('');
    const total = cart.reduce((a,b)=>a+b.price,0);
    document.getElementById('total-val').innerText = `R$ ${total.toLocaleString('pt-BR')}`;
}
