<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMDROP | TERMINAL PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --hacker-cyan: #00f2ff; --hacker-green: #00ff41; --bg-black: #050505; }
        body { background: var(--bg-black); color: var(--hacker-cyan); font-family: 'Fira Code', monospace; margin: 0; overflow-x: hidden; }
        
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        body::before { content: " "; display: block; position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%); z-index: 1000; background-size: 100% 4px; pointer-events: none; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 2px solid var(--hacker-cyan); background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1100; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .card { background: rgba(0, 30, 30, 0.4); border: 1px solid rgba(0, 242, 255, 0.2); padding: 20px; clip-path: polygon(0 0, 90% 0, 100% 15%, 100% 100%, 10% 100%, 0 85%); transition: 0.3s; }
        .card:hover { border-color: var(--hacker-green); box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); }

        .btn-main { width: 100%; background: transparent; border: 1px solid var(--hacker-cyan); color: var(--hacker-cyan); padding: 15px; cursor: pointer; margin-top: 15px; font-family: 'Fira Code'; font-weight: bold; text-transform: uppercase; }
        .btn-main:hover { background: var(--hacker-cyan); color: #000; }

        .data-box { background: #000; border: 1px dashed var(--hacker-green); padding: 12px; margin-top: 10px; display: none; font-size: 0.8rem; animation: glitch 0.2s ease; }
        @keyframes glitch { 0% { transform: skew(5deg); } 100% { transform: skew(0); } }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--hacker-green); color: #000; padding: 10px 20px; font-weight: bold; display: none; z-index: 3000; }
        
        #install-banner { position: fixed; bottom: 0; width: 100%; background: var(--hacker-cyan); color: #000; padding: 15px; display: none; justify-content: center; align-items: center; z-index: 2000; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <nav>
        <div style="font-weight: bold;">> STREAMDROP</div>
        <div id="badge" style="font-size: 0.6rem; color: var(--hacker-green);">SISTEMA_OK</div>
    </nav>

    <div class="container">
        <div class="grid" id="mainGrid"></div>
    </div>

    <div id="install-banner">
        APP STREAMDROP DISPONÍVEL <button onclick="installApp()" style="margin-left:20px; background:#000; color:#fff; border:none; padding:5px 15px; cursor:pointer;">INSTALAR</button>
    </div>

    <div id="toast">DADOS_COPIADOS</div>

    <script>
        const SUPABASE_URL = 'https://zkhradhpwakvtgsilsyj.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_UrUxPsPD3XBTANwwp3tZOA_-REppnf3';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- PWA LOGIC ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'flex';
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-banner').style.display = 'none';
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // --- MATRIX EFFECT ---
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/16)).fill(1);
        function matrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0"; ctx.font = "15px arial";
            drops.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(Math.random() * 128), i * 16, y * 16);
                if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(matrix, 50);

        // --- DATA LOGIC ---
        async function load() {
            const { data } = await _supabase.from('contas').select('*').order('created_at', { ascending: false });
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = data.map(c => `
                <div class="card">
                    <div style="font-size:0.6rem; color:var(--hacker-green)">[ SESSÃO_ATIVA ]</div>
                    <h3 style="margin:10px 0;">${c.servico}</h3>
                    <p style="font-size:0.7rem; opacity:0.6">${c.desc_servico}</p>
                    <div class="data-box" id="box-${c.id}">
                        <div onclick="copy('${c.usuario}')" style="margin-bottom:8px; cursor:pointer">USUÁRIO: ${c.usuario}</div>
                        <div onclick="copy('${c.senha}')" style="cursor:pointer">SENHA: ${c.senha}</div>
                    </div>
                    <button class="btn-main" onclick="toggle(${c.id})">VER CREDENCIAIS</button>
                </div>
            `).join('');
            document.getElementById('badge').innerText = `SISTEMA: ${data.length} ATIVOS`;
        }

        function toggle(id) {
            const b = document.getElementById(`box-${id}`);
            b.style.display = b.style.display === 'block' ? 'none' : 'block';
        }

        function copy(t) {
            navigator.clipboard.writeText(t);
            const ts = document.getElementById('toast');
            ts.style.display = 'block'; setTimeout(() => ts.style.display = 'none', 2000);
        }

        load();
    </script>
</body>
</html>
