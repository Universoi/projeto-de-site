<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrativo | SHOPP STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #F8FAFC; 
            color: #1E293B;
        }

        /* Efeito de Vidro e Sombras Suaves */
        .glass-card { 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .input-elegant {
            transition: all 0.2s ease;
            border: 1.5px solid #E2E8F0;
            background: #F1F5F9;
        }

        .input-elegant:focus {
            border-color: #2563EB;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Animação de entrada */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-slide-up { animation: slideUp 0.4s ease forwards; }
        
        .hidden { display: none !important; }
        
        /* Estilização da Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-[3000] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[40px] p-12 shadow-2xl text-center animate-slide-up">
            <div class="w-24 h-24 bg-blue-600 rounded-[32px] flex items-center justify-center mx-auto mb-8 rotate-3 shadow-xl shadow-blue-500/20">
                <i class="fa-solid fa-shield-halved text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-extrabold mb-2 tracking-tight">Portal Jari</h2>
            <p class="text-slate-500 mb-10">Gerencie seu inventário com segurança.</p>
            
            <div class="space-y-5 text-left">
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="user-login" class="input-elegant pl-12 py-4 rounded-2xl w-full outline-none" placeholder="Usuário">
                </div>
                <div class="relative">
                    <i class="fa-regular fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="pass-login" class="input-elegant pl-12 py-4 rounded-2xl w-full outline-none" placeholder="Senha">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 hover:bg-blue-700 hover:-translate-y-0.5 transition-all">
                    ACESSAR PAINEL
                </button>
            </div>
        </div>
    </div>

    <div id="admin-content" class="max-w-6xl mx-auto px-4 py-8 md:py-12 hidden">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <span class="text-blue-600 font-bold tracking-widest text-xs uppercase">Dashboard</span>
                <h1 class="text-5xl font-extrabold tracking-tighter mt-1">SHOPP <span class="text-blue-600">STORE</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="logout()" class="px-6 py-3 text-slate-500 font-semibold hover:bg-slate-100 rounded-2xl transition">Sair</button>
                <button onclick="toggleForm()" class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> NOVO PRODUTO
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass-card p-6 border-l-4 border-blue-500">
                <p class="text-slate-500 text-sm font-semibold">Total de Produtos</p>
                <h3 id="stat-total" class="text-3xl font-black mt-1">0</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-emerald-500">
                <p class="text-slate-500 text-sm font-semibold">Preço Médio</p>
                <h3 id="stat-avg" class="text-3xl font-black mt-1 text-emerald-600">R$ 0</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-amber-500">
                <p class="text-slate-500 text-sm font-semibold">Categorias Ativas</p>
                <h3 id="stat-cat" class="text-3xl font-black mt-1">0</h3>
            </div>
        </div>

        <div id="product-form-container" class="hidden glass-card p-8 mb-12 animate-slide-up bg-white">
            <div class="flex justify-between items-center mb-8">
                <h3 id="form-title" class="text-2xl font-bold italic">Configurar Item</h3>
                <button onclick="toggleForm()" class="text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="product-form" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <input type="hidden" id="prod-id">
                
                <div class="md:col-span-2 space-y-1">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Nome do Produto</label>
                    <input type="text" id="name" required class="input-elegant rounded-2xl p-4 w-full outline-none">
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Categoria</label>
                    <select id="category" required class="input-elegant rounded-2xl p-4 w-full outline-none appearance-none">
                        <option value="iPhone">iPhone</option>
                        <option value="Samsung">Samsung</option>
                        <option value="Xiaomi">Xiaomi</option>
                        <option value="Motorola">Motorola</option>
                        <option value="Acessórios">Acessórios</option>
                        </select>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Preço (R$)</label>
                    <input type="number" step="0.01" id="price" required class="input-elegant rounded-2xl p-4 w-full outline-none" placeholder="0.00">
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Preço Promo (R$)</label>
                    <input type="number" step="0.01" id="promo_price" class="input-elegant rounded-2xl p-4 w-full outline-none" placeholder="Deixe vazio se não houver">
                </div>

                <div class="space-y-1 md:col-span-1">
                     <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Preview</label>
                     <div id="image-preview" class="h-[58px] flex gap-2 items-center overflow-x-auto">
                        </div>
                </div>

                <div class="md:col-span-3">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-2 block">Mídias (Máx 4)</label>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div class="relative group">
                            <input type="text" id="img1" placeholder="URL da foto" class="input-elegant text-xs pr-10 p-3 rounded-xl w-full">
                            <label for="f1" class="absolute right-2 top-1/2 -translate-y-1/2 cursor-pointer text-blue-600 hover:scale-110 transition"><i class="fa-solid fa-cloud-arrow-up"></i></label>
                            <input type="file" id="f1" class="hidden" onchange="uploadFile(this, 'img1')">
                        </div>
                        <div class="relative group"><input type="text" id="img2" placeholder="URL 2" class="input-elegant text-xs p-3 rounded-xl w-full"></div>
                        <div class="relative group"><input type="text" id="img3" placeholder="URL 3" class="input-elegant text-xs p-3 rounded-xl w-full"></div>
                        <div class="relative group"><input type="text" id="img4" placeholder="URL 4" class="input-elegant text-xs p-3 rounded-xl w-full"></div>
                    </div>
                </div>

                <div class="md:col-span-3">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Descrição Detalhada</label>
                    <textarea id="description" rows="3" class="input-elegant rounded-2xl p-4 w-full outline-none"></textarea>
                </div>

                <div class="md:col-span-3 flex gap-3 pt-4">
                    <button type="submit" class="bg-blue-600 text-white px-12 py-4 rounded-2xl font-bold flex-1 shadow-lg shadow-blue-200">SALVAR ALTERAÇÕES</button>
                    <button type="button" onclick="toggleForm()" class="bg-slate-100 text-slate-600 px-8 py-4 rounded-2xl font-bold">CANCELAR</button>
                </div>
            </form>
        </div>

        <div class="glass-card overflow-hidden">
            <div class="p-8 border-b border-slate-100 flex flex-col md:flex-row justify-between gap-4 bg-white/50">
                <div class="relative max-w-md w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="admin-search" oninput="filterProducts()" placeholder="Pesquisar no inventário..." class="pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl w-full outline-none focus:ring-2 ring-blue-100 transition">
                </div>
                <div class="flex items-center gap-2 text-sm font-medium text-slate-500">
                    <span id="product-count">0</span> produtos encontrados
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50/50 text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                            <th class="px-8 py-4">Produto</th>
                            <th class="px-8 py-4">Categoria</th>
                            <th class="px-8 py-4">Preço Atual</th>
                            <th class="px-8 py-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
            
            <div id="empty-state" class="hidden p-20 text-center">
                <i class="fa-solid fa-box-open text-6xl text-slate-200 mb-4"></i>
                <p class="text-slate-400 font-medium">Nenhum produto encontrado.</p>
            </div>
        </div>
    </div>

    <script>
        // MANTENHA SUAS CONFIGURAÇÕES ORIGINAIS AQUI
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "1234";
        const SUPABASE_URL = 'https://zkhradhpwakvtgsilsyj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UrUxPsPD3XBTANwwp3tZOA_-REppnf3';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];

        function handleLogin() {
            const user = document.getElementById('user-login').value;
            const pass = document.getElementById('pass-login').value;
            if(user === ADMIN_USER && pass === ADMIN_PASS) {
                sessionStorage.setItem('shopp_jari_auth', 'true');
                checkAuth();
            } else { alert("Acesso negado!"); }
        }

        function checkAuth() {
            if(sessionStorage.getItem('shopp_jari_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadProducts();
            }
        }

        function logout() { sessionStorage.removeItem('shopp_jari_auth'); location.reload(); }

        async function uploadFile(input, targetId) {
            const file = input.files[0];
            if (!file) return;
            const label = input.previousElementSibling;
            label.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-blue-600"></i>';
            
            const fileName = `${Date.now()}-${file.name}`;
            const { data, error } = await _supabase.storage.from('fotos-produtos').upload(fileName, file);
            
            if (error) { 
                alert("Erro no upload"); 
                label.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i>';
                return; 
            }
            
            const { data: publicUrl } = _supabase.storage.from('fotos-produtos').getPublicUrl(fileName);
            document.getElementById(targetId).value = publicUrl.publicUrl;
            label.innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i>';
        }

        async function loadProducts() {
            const { data } = await _supabase.from('produtos').select('*').order('id', { ascending: false });
            products = data || [];
            updateStats();
            renderTable(products);
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = products.length;
            document.getElementById('product-count').innerText = products.length;
            
            const avg = products.reduce((acc, p) => acc + (p.price || 0), 0) / (products.length || 1);
            document.getElementById('stat-avg').innerText = `R$ ${avg.toFixed(2)}`;
            
            const categories = [...new Set(products.map(p => p.category))];
            document.getElementById('stat-cat').innerText = categories.length;
        }

        function renderTable(list) {
            const tbody = document.getElementById('admin-product-list');
            const emptyState = document.getElementById('empty-state');
            
            if (list.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            tbody.innerHTML = list.map(p => {
                const img = Array.isArray(p.images) ? p.images[0] : p.images;
                const hasPromo = p.promo_price && p.promo_price < p.price;
                
                return `
                <tr class="hover:bg-slate-50 transition-colors group">
                    <td class="px-8 py-5">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-slate-100 overflow-hidden border border-slate-100 flex-shrink-0">
                                <img src="${img || 'https://via.placeholder.com/100'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 leading-tight">${p.name}</p>
                                <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-tighter">ID: #${p.id}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-5">
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black uppercase rounded-full border border-blue-100">${p.category}</span>
                    </td>
                    <td class="px-8 py-5">
                        ${hasPromo ? `
                            <div class="flex flex-col">
                                <span class="text-xs text-slate-400 line-through">R$ ${p.price.toFixed(2)}</span>
                                <span class="text-emerald-600 font-extrabold font-mono">R$ ${p.promo_price.toFixed(2)}</span>
                            </div>
                        ` : `
                            <span class="font-extrabold text-slate-700 font-mono">R$ ${p.price.toFixed(2)}</span>
                        `}
                    </td>
                    <td class="px-8 py-5 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="editProduct('${p.id}')" class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition-all flex items-center justify-center">
                                <i class="fa-solid fa-pen-to-square text-sm"></i>
                            </button>
                            <button onclick="deleteProduct('${p.id}')" class="w-10 h-10 rounded-xl bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function filterProducts() {
            const q = document.getElementById('admin-search').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
            renderTable(filtered);
        }

        function toggleForm() { 
            const container = document.getElementById('product-form-container');
            container.classList.toggle('hidden');
            if(!container.classList.contains('hidden')) {
                container.scrollIntoView({ behavior: 'smooth' });
            }
        }

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const imgs = [
                document.getElementById('img1').value, 
                document.getElementById('img2').value, 
                document.getElementById('img3').value, 
                document.getElementById('img4').value
            ].filter(v => v && v.trim() !== "");

            const payload = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                promo_price: document.getElementById('promo_price').value ? parseFloat(document.getElementById('promo_price').value) : null,
                description: document.getElementById('description').value,
                images: imgs
            };

            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> SALVANDO...';
            btn.disabled = true;

            if(id) await _supabase.from('produtos').update(payload).eq('id', id);
            else await _supabase.from('produtos').insert([payload]);

            btn.innerHTML = 'SALVAR ALTERAÇÕES';
            btn.disabled = false;
            
            toggleForm(); 
            loadProducts(); 
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = "";
        };

        async function deleteProduct(id) { 
            if(confirm("Deseja realmente excluir este produto?")) { 
                await _supabase.from('produtos').delete().eq('id', id); 
                loadProducts(); 
            } 
        }

        function editProduct(id) {
            const p = products.find(x => String(x.id) === String(id));
            if(!p) return;
            
            if(document.getElementById('product-form-container').classList.contains('hidden')) {
                toggleForm();
            }

            document.getElementById('form-title').innerText = "Editando: " + p.name;
            document.getElementById('prod-id').value = p.id;
            document.getElementById('name').value = p.name;
            document.getElementById('category').value = p.category;
            document.getElementById('price').value = p.price;
            document.getElementById('promo_price').value = p.promo_price || "";
            document.getElementById('description').value = p.description || "";
            
            const imgs = Array.isArray(p.images) ? p.images : [p.images];
            document.getElementById('img1').value = imgs[0] || "";
            document.getElementById('img2').value = imgs[1] || "";
            document.getElementById('img3').value = imgs[2] || "";
            document.getElementById('img4').value = imgs[3] || "";
        }

        checkAuth();
    </script>
</body>
</html>
