<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Shopp Jari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f7fe; }
        .admin-card { background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        input, select, textarea { border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px; outline: none; width: 100%; }
        .hidden { display: none !important; }
        .btn-upload { background: #e0e7ff; color: #4338ca; padding: 12px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="login-screen" class="fixed inset-0 bg-blue-600 z-[3000] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[32px] p-10 shadow-2xl text-center">
            <div class="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-lock text-3xl text-blue-600"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">Painel Administrativo</h2>
            <p class="text-gray-400 text-sm mb-8">Digite suas credenciais para gerenciar a loja.</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Usuário</label>
                    <input type="text" id="user-login" class="bg-gray-50 border-none focus:ring-2 ring-blue-100" placeholder="Seu usuário">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Senha</label>
                    <input type="password" id="pass-login" class="bg-gray-50 border-none focus:ring-2 ring-blue-100" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 transition mt-4">ENTRAR NO SISTEMA</button>
            </div>
        </div>
    </div>

    <div id="admin-content" class="max-w-6xl mx-auto hidden">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h1 class="text-4xl font-black tracking-tighter">Gestão <span class="text-blue-600">Jari</span></h1>
                <p class="text-gray-400 font-medium">Controle de Inventário e Mídia</p>
            </div>
            <div class="flex gap-3">
                <button onclick="logout()" class="bg-white text-red-500 px-6 py-4 rounded-2xl font-bold shadow-sm border border-gray-100">SAIR</button>
                <button onclick="toggleForm()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black shadow-xl shadow-blue-200">NOVO PRODUTO</button>
            </div>
        </header>

        <div id="product-form-container" class="hidden admin-card p-8 mb-10 border-2 border-blue-100">
            <h3 id="form-title" class="text-2xl font-black mb-8">Gerenciar Produto</h3>
            <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="prod-id">
                <div class="space-y-1"><label class="text-[10px] font-black text-gray-400">NOME</label><input type="text" id="name" required></div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400">CATEGORIA</label>
                    <select id="category" required>
                        <option value="iPhone">iPhone</option><option value="Samsung">Samsung</option><option value="Xiaomi">Xiaomi</option>
                        <option value="Motorola">Motorola</option><option value="Realme">Realme</option><option value="Tablet">Tablet</option>
                        <option value="Som/Caixas">Som/Caixas</option><option value="Games">Games</option><option value="Academia">Academia</option>
                        <option value="Perfumes">Perfumes</option><option value="TV & Box">TV & Box</option><option value="Eletrodomésticos">Eletrodomésticos</option><option value="Acessórios">Acessórios</option>
                    </select>
                </div>
                <div class="space-y-1"><label class="text-[10px] font-black text-gray-400">PREÇO ORIGINAL</label><input type="number" step="0.01" id="price" required></div>
                <div class="space-y-1"><label class="text-[10px] font-black text-gray-400">PREÇO PROMO (OPCIONAL)</label><input type="number" step="0.01" id="promo_price"></div>
                <div class="md:col-span-2 space-y-4">
                    <label class="text-[10px] font-black text-gray-400">IMAGENS (URL OU UPLOAD)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex gap-2"><input type="text" id="img1" placeholder="URL 1"><label for="f1" class="btn-upload"><i class="fa-solid fa-up-long"></i></label><input type="file" id="f1" class="hidden" onchange="uploadFile(this, 'img1')"></div>
                        <div class="flex gap-2"><input type="text" id="img2" placeholder="URL 2"><label for="f2" class="btn-upload"><i class="fa-solid fa-up-long"></i></label><input type="file" id="f2" class="hidden" onchange="uploadFile(this, 'img2')"></div>
                        <div class="flex gap-2"><input type="text" id="img3" placeholder="URL 3"><label for="f3" class="btn-upload"><i class="fa-solid fa-up-long"></i></label><input type="file" id="f3" class="hidden" onchange="uploadFile(this, 'img3')"></div>
                        <div class="flex gap-2"><input type="text" id="img4" placeholder="URL 4"><label for="f4" class="btn-upload"><i class="fa-solid fa-up-long"></i></label><input type="file" id="f4" class="hidden" onchange="uploadFile(this, 'img4')"></div>
                    </div>
                </div>
                <div class="md:col-span-2"><label class="text-[10px] font-black text-gray-400">DESCRIÇÃO</label><textarea id="description" rows="3"></textarea></div>
                <div class="md:col-span-2 flex gap-4"><button type="submit" class="bg-black text-white px-10 py-4 rounded-2xl font-black flex-1">SALVAR</button><button type="button" onclick="toggleForm()" class="bg-gray-100 px-10 py-4 rounded-2xl font-bold">CANCELAR</button></div>
            </form>
        </div>

        <div class="admin-card overflow-hidden">
            <div class="p-6 border-b"><input type="text" id="admin-search" oninput="filterProducts()" placeholder="Buscar por nome ou categoria..." class="max-w-xs bg-gray-50 border-none"></div>
            <table class="w-full text-left">
                <tbody id="admin-product-list" class="divide-y divide-gray-50"></tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DE ACESSO
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "1234";

        const SUPABASE_URL = 'https://zkhradhpwakvtgsilsyj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UrUxPsPD3XBTANwwp3tZOA_-REppnf3';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];

        // LÓGICA DE LOGIN
        function handleLogin() {
            const user = document.getElementById('user-login').value;
            const pass = document.getElementById('pass-login').value;

            if(user === ADMIN_USER && pass === ADMIN_PASS) {
                sessionStorage.setItem('shopp_jari_auth', 'true');
                checkAuth();
            } else {
                alert("Usuário ou senha incorretos!");
            }
        }

        function checkAuth() {
            if(sessionStorage.getItem('shopp_jari_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadProducts();
            }
        }

        function logout() {
            sessionStorage.removeItem('shopp_jari_auth');
            location.reload();
        }

        // LÓGICA DE GESTÃO
        async function uploadFile(input, targetId) {
            const file = input.files[0];
            if (!file) return;
            const btnLabel = input.previousElementSibling;
            btnLabel.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            const fileName = `${Date.now()}-${file.name}`;
            const { data, error } = await _supabase.storage.from('fotos-produtos').upload(fileName, file);
            if (error) { alert("Erro: " + error.message); btnLabel.innerHTML = '<i class="fa-solid fa-up-long"></i>'; return; }
            const { data: publicUrl } = _supabase.storage.from('fotos-produtos').getPublicUrl(fileName);
            document.getElementById(targetId).value = publicUrl.publicUrl;
            btnLabel.innerHTML = '<i class="fa-solid fa-check text-green-500"></i>';
        }

        async function loadProducts() {
            const { data } = await _supabase.from('produtos').select('*').order('id', { ascending: false });
            products = data || [];
            renderTable(products);
        }

        function renderTable(list) {
            const tbody = document.getElementById('admin-product-list');
            tbody.innerHTML = list.map(p => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-6 flex items-center gap-4">
                        <img src="${Array.isArray(p.images)?p.images[0]:p.images}" class="w-12 h-12 rounded-lg object-contain bg-gray-100">
                        <div class="flex flex-col"><span class="font-bold">${p.name}</span><span class="text-[10px] text-gray-400 font-black uppercase">${p.category}</span></div>
                    </td>
                    <td class="p-6 text-blue-600 font-black">R$ ${p.promo_price || p.price}</td>
                    <td class="p-6 text-right">
                        <button onclick="editProduct('${p.id}')" class="p-2 text-blue-600"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProduct('${p.id}')" class="p-2 text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`).join('');
        }

        function filterProducts() {
            const q = document.getElementById('admin-search').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
            renderTable(filtered);
        }

        function toggleForm() { document.getElementById('product-form-container').classList.toggle('hidden'); }

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const imgs = [document.getElementById('img1').value, document.getElementById('img2').value, document.getElementById('img3').value, document.getElementById('img4').value].filter(v => v.trim() !== "");
            const payload = {
                name: document.getElementById('name').value, category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value), promo_price: document.getElementById('promo_price').value ? parseFloat(document.getElementById('promo_price').value) : null,
                description: document.getElementById('description').value, images: imgs
            };
            if(id) await _supabase.from('produtos').update(payload).eq('id', id);
            else await _supabase.from('produtos').insert([payload]);
            toggleForm(); loadProducts(); document.getElementById('product-form').reset();
        };

        async function deleteProduct(id) { if(confirm("Excluir?")) { await _supabase.from('produtos').delete().eq('id', id); loadProducts(); } }

        function editProduct(id) {
            const p = products.find(x => String(x.id) === String(id));
            toggleForm();
            document.getElementById('prod-id').value = p.id;
            document.getElementById('name').value = p.name;
            document.getElementById('category').value = p.category;
            document.getElementById('price').value = p.price;
            document.getElementById('promo_price').value = p.promo_price || "";
            document.getElementById('description').value = p.description || "";
            const imgs = Array.isArray(p.images) ? p.images : [p.images];
            document.getElementById('img1').value = imgs[0] || "";
            document.getElementById('img2').value = imgs[1] || "";
            document.getElementById('img3').value = imgs[2] || "";
            document.getElementById('img4').value = imgs[3] || "";
        }

        checkAuth();
    </script>
</body>

</html>
