<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCATEIA | Comando Central</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00FF66; --bg: #030303; --card: #0A0A0A; --border: #1A1A1A;
            --text-main: #FFFFFF; --text-dim: #666; --success: #00FF66; --danger: #FF3131; --warning: #F59E0B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* LOGIN */
        #loginOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 15px; background: #000; border: 1px solid #222; color: var(--primary); border-radius: 12px; margin-bottom: 15px; text-align: center; font-size: 1.5rem; letter-spacing: 5px; }

        /* LAYOUT RESPONSIVO */
        #adminContent { display: none; width: 100%; height: 100%; flex-direction: row; }
        
        /* Menu Lateral */
        aside { 
            width: 260px; background: #000; border-right: 1px solid var(--border); 
            padding: 40px 20px; display: flex; flex-direction: column; 
            transition: transform 0.3s ease;
        }
        
        .logo { font-family: 'Syncopate'; font-size: 1.2rem; color: var(--primary); margin-bottom: 50px; text-align: center; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 12px; color: var(--text-dim); text-decoration: none; cursor: pointer; font-weight: 600; }
        .nav-link.active { background: var(--card); color: var(--primary); border: 1px solid var(--border); }

        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
        
        /* Topo */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; gap: 15px; }
        .mobile-menu-toggle { display: none; background: none; border: none; color: white; cursor: pointer; }

        .btn-refresh { background: var(--primary); color: black; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 0.8rem; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .stat-card span { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; }
        .stat-card p { font-size: 1.8rem; font-weight: 800; margin-top: 10px; }

        /* TABLE */
        .table-wrap { background: var(--card); border-radius: 24px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { padding: 20px; background: #0F0F0F; text-align: left; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        td { padding: 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; }
        
        .status-Pendente { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-Ativo { background: rgba(0, 255, 102, 0.1); color: var(--success); }
        .status-Atrasado { background: rgba(255, 49, 49, 0.2); color: var(--danger); }

        .btn-action { width: 35px; height: 35px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: white; cursor: pointer; margin-left: 5px; transition: 0.3s; }
        .btn-action:hover { border-color: var(--primary); color: var(--primary); }

        /* MODAL CRM */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; }
        .modal-box { background: #0D0D0D; padding: 30px; border-radius: 24px; width: 100%; max-width: 420px; border: 1px solid var(--border); }
        .msg-option { width: 100%; padding: 18px; background: #111; border: 1px solid var(--border); color: white; border-radius: 12px; margin-bottom: 12px; cursor: pointer; text-align: left; }
        
        /* ADAPTAÇÃO PARA CELULAR (MEDIA QUERIES) */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { 
                position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; 
                transform: translateX(-100%); width: 260px; 
            }
            aside.open { transform: translateX(0); }
            
            main { padding: 20px; }
            .mobile-menu-toggle { display: block; }
            
            .header h1 { font-size: 0.9rem; }
            .stats-grid { gap: 10px; }
            .stat-card { padding: 15px; }
            .stat-card p { font-size: 1.4rem; }
            
            .btn-refresh span { display: none; } /* Esconde texto do botão atualizar no celular */
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="font-family:'Syncopate'; color:var(--primary); margin-bottom:20px; font-size:0.8rem;">🔐 ACESSO ALCATEIA</h2>
            <input type="password" id="passInput" class="login-input" placeholder="••••">
            <button onclick="checkPass()" class="btn-refresh" style="width: 100%; justify-content: center;">ACESSAR</button>
        </div>
    </div>

    <div id="adminContent">
        <aside id="sidebar">
            <div class="logo">ALCATEIA</div>
            <nav>
                <div class="nav-link active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
                <div class="nav-link" onclick="toggleMenu()"><i data-lucide="users"></i> Membros</div>
            </nav>
            <div style="margin-top: auto;">
                <div class="nav-link" onclick="location.reload()" style="color: var(--danger)"><i data-lucide="power"></i> Sair</div>
            </div>
        </aside>

        <main>
            <div class="header">
                <button class="mobile-menu-toggle" onclick="toggleMenu()">
                    <i data-lucide="menu"></i>
                </button>
                <h1 style="font-family:'Syncopate';">COMANDO CENTRAL</h1>
                <button class="btn-refresh" onclick="fetchData()">
                    <i data-lucide="refresh-cw"></i> <span>ATUALIZAR</span>
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><span>Membros</span><p id="sTotal">0</p></div>
                <div class="stat-card"><span>Ativos</span><p id="sAtivos" style="color: var(--success)">0</p></div>
                <div class="stat-card"><span>Vencidos</span><p id="sAtrasados" style="color: var(--danger)">0</p></div>
                <div class="stat-card"><span>Receita</span><p id="sFatura" style="color: var(--primary)">R$ 0</p></div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Plano</th>
                            <th>Venc.</th>
                            <th>Status</th>
                            <th style="text-align:right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="alunoTabela"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalMsg" class="modal">
        <div class="modal-box">
            <h3 id="crmNome" style="color:var(--primary); font-family:'Syncopate'; font-size:0.8rem; margin-bottom:20px;">WHATSAPP CRM</h3>
            <div id="listaMensagens"></div>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer; font-weight:800; font-size:0.7rem;">FECHAR JANELA</button>
        </div>
    </div>

    <script>
        const SENHA_MESTRA = "1234";
        const MINHA_CHAVE_PIX = "SUA_CHAVE_PIX_AQUI";

        const _supabase = supabase.createClient("https://zkhradhpwakvtgsilsyj.supabase.co", "sb_publishable_UrUxPsPD3XBTANwwp3tZOA_-REppnf3");

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function checkPass() {
            if(document.getElementById('passInput').value === SENHA_MESTRA) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'flex';
                fetchData();
            } else { alert("Senha Incorreta!"); }
        }

        async function fetchData() {
            const { data, error } = await _supabase.from('matriculas').select('*').order('created_at', { ascending: false });
            if (error) return;

            const tbody = document.getElementById('alunoTabela');
            tbody.innerHTML = "";
            let counts = { total: data.length, ativos: 0, atrasados: 0, faturamento: 0 };
            const hoje = new Date().toISOString().split('T')[0];

            data.forEach(aluno => {
                let st = aluno.status || 'Pendente';
                if (st === 'Ativo' && aluno.data_vencimento < hoje) { st = 'Atrasado'; counts.atrasados++; }
                else if (st === 'Ativo') { counts.ativos++; counts.faturamento += aluno.plano.includes('Alfa') ? 189 : 119; }

                tbody.innerHTML += `
                    <tr>
                        <td><b style="font-size:0.8rem">${aluno.nome.toUpperCase()}</b><br><small style="color:#555">${aluno.whatsapp}</small></td>
                        <td style="color:var(--primary)"><b>${aluno.plano.split(' ')[0]}</b></td>
                        <td><code style="font-size:0.7rem">${aluno.data_vencimento ? aluno.data_vencimento.split('-').reverse().slice(0,2).join('/') : '--'}</code></td>
                        <td><span class="badge status-${st}">${st}</span></td>
                        <td style="text-align:right">
                            <button class="btn-action" onclick="abrirCrm('${aluno.nome}', '${aluno.whatsapp}', '${aluno.plano}')"><i data-lucide="message-square" style="width:14px"></i></button>
                            <button class="btn-action" onclick="alterarData('${aluno.id}', '${aluno.nome}')"><i data-lucide="calendar" style="width:14px"></i></button>
                        </td>
                    </tr>`;
            });

            document.getElementById('sTotal').innerText = counts.total;
            document.getElementById('sAtivos').innerText = counts.ativos;
            document.getElementById('sAtrasados').innerText = counts.atrasados;
            document.getElementById('sFatura').innerText = `R$ ${counts.faturamento}`;
            lucide.createIcons();
        }

        async function alterarData(id, nome) {
            const nova = prompt(`Novo Vencimento para ${nome} (AAAA-MM-DD):`, new Date(new Date().setMonth(new Date().getMonth() + 1)).toISOString().split('T')[0]);
            if(nova) {
                await _supabase.from('matriculas').update({ data_vencimento: nova, status: 'Ativo' }).eq('id', id);
                fetchData();
            }
        }

        function abrirCrm(nome, tel, plano) {
            const container = document.getElementById('listaMensagens');
            const primeiroNome = nome.split(' ')[0];
            const valorPlano = plano.includes('Alfa') ? '189,00' : '119,00';
            document.getElementById('crmNome').innerText = `CRM: ${primeiroNome.toUpperCase()}`;

            const scripts = [
                { label: "Boas-vindas", msg: `Fala ${primeiroNome}! Aqui é da ALCATEIA. 🐺 Vi que você se cadastrou. Quando quer vir conhecer a estrutura?` },
                { label: "Cobrança PIX", msg: `E aí ${primeiroNome}! Sua renovação (${plano}) está pronta. 🐺\n\nValor: R$ ${valorPlano}\nChave PIX: ${MINHA_CHAVE_PIX}\n\nMe envia o comprovante!` },
                { label: "Aviso Atraso", msg: `Fala ${primeiroNome}! Notamos que sua mensalidade está pendente. 🐺 Consegue resolver hoje?` }
            ];

            container.innerHTML = "";
            scripts.forEach(s => {
                const btn = document.createElement('button');
                btn.className = "msg-option";
                btn.innerHTML = `<b>${s.label}</b><span>${s.msg.substring(0, 45)}...</span>`;
                btn.onclick = () => { window.open(`https://wa.me/55${tel.replace(/\D/g,'')}?text=${encodeURIComponent(s.msg)}`, '_blank'); };
                container.appendChild(btn);
            });
            document.getElementById('modalMsg').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalMsg').style.display = 'none'; }
        lucide.createIcons();
    </script>
</body>
</html>
